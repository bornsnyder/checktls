<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>checktls — sign in</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, 0.15);
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px;
    }
    .card {
      width: 100%; max-width: 380px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 32px 28px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 22px; font-size: 0.9rem; }
    label {
      display: block; font-size: 0.8rem; font-weight: 600; letter-spacing: .06em;
      color: var(--muted); margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%; padding: 12px 14px; font-size: 1rem; letter-spacing: .05em;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; outline: none; margin-bottom: 16px;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      transition: filter .15s ease;
    }
    button:hover { filter: brightness(1.1); }
    .err {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
      background: var(--red-bg); color: #fca5a5; border: 1px solid var(--red);
    }
    .hint { margin-top: 18px; color: var(--muted); font-size: 0.78rem; text-align: center; }
    code { background: rgba(148,163,184,.15); padding: 1px 6px; border-radius: 5px; font-size: .9em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>checktls</h1>
    <p class="sub">This service is protected. Enter the access token to continue.</p>
    <form method="post" autocomplete="off">
      <label for="token">ACCESS TOKEN</label>
      <input type="text" id="token" name="token" placeholder="e.g. k7Qm2xWp9RtL4nB" spellcheck="false" autofocus required />
      <button type="submit">Sign in</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <p class="hint">The token is printed in the service logs and stored in the <code>.env</code> file.</p>
  </div>
</body>
</html>
