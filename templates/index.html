<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>checktls — MX Root CA vs Mimecast</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #16a34a;
      --green-bg: rgba(22, 163, 74, 0.15);
      --yellow: #d97706;
      --yellow-bg: rgba(217, 119, 6, 0.18);
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, 0.15);
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 1.9rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }
    form { display: flex; gap: 10px; margin-bottom: 8px; }
    input[type="text"] {
      flex: 1; padding: 13px 16px; font-size: 1rem;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      padding: 13px 26px; font-size: 1rem; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      transition: filter .15s ease;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 0.82rem; margin-bottom: 24px; }

    #results { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
    }
    .banner {
      font-size: 1.35rem; font-weight: 700; text-align: center;
      padding: 22px 16px; border-radius: 10px; margin-bottom: 4px;
    }
    .banner.green  { background: var(--green-bg);  color: #4ade80; border: 1px solid var(--green); }
    .banner.yellow { background: var(--yellow-bg); color: #fbbf24; border: 1px solid var(--yellow); }
    .banner.red    { background: var(--red-bg);    color: #f87171; border: 1px solid var(--red); }
    .valid-until {
      text-align: center; margin: -6px 0 14px; font-size: 0.95rem;
      color: var(--text);
    }
    .valid-until strong { color: #fff; }
    .valid-until .label { color: var(--muted); }
    .host-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .host-name { font-weight: 600; font-size: 1.05rem; word-break: break-all; }
    .prio { color: var(--muted); font-size: 0.8rem; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin-top: 12px; font-size: 0.9rem; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; word-break: break-word; }
    .note { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
            background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,.3); }
    .err { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
           background: var(--red-bg); color: #fca5a5; border: 1px solid var(--red); }
    .top-error { padding: 16px; border-radius: 10px; background: var(--panel);
                 border: 1px solid var(--border); color: var(--muted); }
    .spinner { text-align: center; color: var(--muted); padding: 30px; font-size: 0.95rem; }
    .meta { margin-top: 26px; color: var(--muted); font-size: 0.78rem; text-align: center; }
    code { background: rgba(148,163,184,.15); padding: 1px 6px; border-radius: 5px; font-size: .9em; }

    /* Collapsed certificate-chain DETAILS block */
    details.chain {
      margin-top: 14px; border: 1px solid var(--border);
      border-radius: 8px; background: rgba(15, 23, 42, 0.6); overflow: hidden;
    }
    details.chain > summary {
      cursor: pointer; padding: 9px 12px; font-size: 0.85rem; font-weight: 600;
      color: var(--muted); list-style: none; user-select: none;
    }
    details.chain > summary::-webkit-details-marker { display: none; }
    details.chain > summary::before { content: '▸ '; color: var(--accent); }
    details.chain[open] > summary::before { content: '▾ '; }
    details.chain pre {
      margin: 0; padding: 12px 14px; font-size: 0.78rem; line-height: 1.5;
      color: #cbd5e1; white-space: pre-wrap; word-break: break-word;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>checktls</h1>
    <p class="sub">Checks whether a domain's mail server (MX) root CA is accepted by Mimecast.</p>

    <form id="checkForm" autocomplete="off">
      <input type="text" id="domain" placeholder="example.com" required />
      <button type="submit" id="btn">Check</button>
    </form>
    <p class="hint">Enter a domain. We resolve its MX records, connect to each mail server over TLS, and compare the root CA against Mimecast's supported-certificate list.</p>

    <div id="results"></div>

    <p class="meta" id="meta"></p>
  </div>

  <script>
    const form = document.getElementById('checkForm');
    const input = document.getElementById('domain');
    const btn = document.getElementById('btn');
    const results = document.getElementById('results');
    const meta = document.getElementById('meta');

    // Render the per-host certificate chain in the requested text format.
    function formatChainDetails(h) {
      const lines = [];
      (h.details || []).forEach((d, i) => {
        if (i > 0) {
          lines.push(`Certificate #${d.index} of ${d.total}${h.host ? ' (sent by MX)' : ''}:`);
        }
        lines.push(`Cert VALIDATED: ${d.validated || 'ok'}`);
        if (i === 0 && d.hostname_verified) {
          lines.push(`Cert Hostname VERIFIED (${h.host} = ${h.leaf_cn || h.host} | DNS:${h.host})`);
        }
        if (d.ocsp) lines.push(d.ocsp);
        lines.push(`Not Valid Before: ${d.not_valid_before}`);
        lines.push(`Not Valid After: ${d.not_valid_after}`);
        lines.push(`Seconds Until Expired: ${d.seconds_until_expired}`);
        lines.push(`subject: ${d.subject}`);
        lines.push(`issuer: ${d.issuer}`);
      });
      return lines.join('\n');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const domain = input.value.trim().toLowerCase();
      if (!domain) return;
      btn.disabled = true;
      btn.textContent = 'Checking…';
      results.innerHTML = '<div class="spinner">Resolving MX records and connecting to mail servers…</div>';
      meta.textContent = '';

      try {
        const resp = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ domain }),
        });
        const data = await resp.json();

        if (!resp.ok) {
          results.innerHTML = `<div class="top-error">${esc(data.error || 'Something went wrong.')}</div>`;
          return;
        }

        if (data.error && !data.hosts?.length) {
          results.innerHTML = `<div class="top-error">${esc(data.error)}</div>`;
          return;
        }

        let html = '';
        for (const h of data.hosts) {
          // Green = full match, yellow = partial brand match, red = no match / failure.
          const bannerClass = h.status === 'ok'
            ? (h.matched ? 'green' : (h.partial_matched ? 'yellow' : 'red'))
            : '';
          const bannerText = h.status !== 'ok'
            ? 'CHECK FAILED'
            : (h.matched
                ? 'Root CA PRESENT on mimecast'
                : (h.partial_matched
                    ? 'Root CA PARTIALLY MATCHED on mimecast'
                    : 'Root CA NOT PRESENT on mimecast'));

          html += `<div class="card">`;
          if (bannerClass) {
            html += `<div class="banner ${bannerClass}">${esc(bannerText)}</div>`;
          } else {
            html += `<div class="banner red" style="font-size:1.05rem;">${esc('CHECK FAILED')}</div>`;
          }

          html += `<div class="host-head">
              <span class="host-name">${esc(h.host)}</span>
              ${h.priority != null ? `<span class="prio">MX priority ${esc(h.priority)}</span>` : ''}
            </div>`;

          if (h.status === 'ok' && h.valid_until) {
            html += `<div class="valid-until"><span class="label">Certificate valid until:</span> <strong>${esc(h.valid_until)}</strong></div>`;
          }

          if (h.status === 'ok') {
            html += `<dl class="kv">
                <dt>Root CA</dt><dd>${esc(h.root_ca || 'unknown')}</dd>
                <dt>Leaf cert CN</dt><dd>${esc(h.leaf_cn || 'n/a')}</dd>`;
            if (h.matched && h.matched_entry) {
              html += `<dt>Mimecast entry</dt><dd>${esc(h.matched_entry)}</dd>`;
            }
            if (!h.matched && h.partial_matched && h.partial_entry) {
              html += `<dt>Closest Mimecast entry</dt><dd>${esc(h.partial_entry)}</dd>`;
            }
            html += `</dl>`;
          }

          // Collapsed certificate-chain DETAILS (expanded on click).
          if (h.status === 'ok' && Array.isArray(h.details) && h.details.length) {
            const chainText = formatChainDetails(h);
            html += `<details class="chain"><summary>Certificate chain details</summary><pre>${esc(chainText)}</pre></details>`;
          }

          if (h.error) {
            const isNote = h.status === 'ok';
            html += `<div class="${isNote ? 'note' : 'err'}">${esc(h.error)}</div>`;
          }
          html += `</div>`;
        }
        results.innerHTML = html;

        if (data.mimecast_ca_count) {
          meta.textContent = `Compared against ${data.mimecast_ca_count} Mimecast supported certificates.`;
        }
      } catch (err) {
        results.innerHTML = `<div class="top-error">Request failed: ${esc(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Check';
      }
    });
  </script>
</body>
</html>
